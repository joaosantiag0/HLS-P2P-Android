services:
  server:
    build:
      context: ../server
      dockerfile: ../deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDR: ":8080"
      CACHE_DIR: /app/data/cache
      CACHE_MAX_BYTES: "2147483648"
      SESSION_TTL: "2h"
      ALLOW_PRIVATE_NET: "false"
      ACCESS_SECRET: "${ACCESS_SECRET:-}"
      # TURN público (Open Relay). Opcional: METERED_API_KEY para credenciais da conta free.
      STUN_URLS: "${STUN_URLS:-stun:stun.l.google.com:19302,stun:stun.relay.metered.ca:80}"
      TURN_URL: "${TURN_URL:-turn:openrelay.metered.ca:80,turn:openrelay.metered.ca:80?transport=tcp,turn:openrelay.metered.ca:443,turn:openrelay.metered.ca:443?transport=tcp}"
      TURN_USER: "${TURN_USER:-openrelayproject}"
      TURN_PASS: "${TURN_PASS:-openrelayproject}"
      METERED_API_KEY: "${METERED_API_KEY:-}"
      MAX_SEGMENT_BYTES: "33554432"
      ORIGIN_TIMEOUT: "15s"
    volumes:
      - p2p-cache:/app/data/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  # TURN local opcional (se preferir não usar o público):
  # docker compose --profile turn up -d
  coturn:
    profiles: ["turn"]
    image: coturn/coturn:4.6
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49152-49200:49152-49200/udp"
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--min-port=49152"
      - "--max-port=49200"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--user=${TURN_USER:-p2p}:${TURN_PASS:-p2psecret}"
      - "--realm=p2pplayer.local"
      - "--no-cli"
      - "--no-tls"
      - "--no-dtls"
      - "--external-ip=${TURN_EXTERNAL_IP:-}"
    restart: unless-stopped

volumes:
  p2p-cache:
